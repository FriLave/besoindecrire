# Production stack: `docker compose -f docker-compose.prod.yml up --build -d`
# Env is read from `.env` (see .env.example). DATABASE_URL is overridden below to target the `postgres` service.
services:
  app:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:-payload}@postgres:5432/payload
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/public/media
      - private-files:/app/private-files
    ports:
      - '${APP_PORT:-3000}:3000'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: payload
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Daily pg_dump (BACKUP_CRON, default 02:00 UTC) to the `backups` volume, or to S3 if BACKUP_S3_BUCKET is set.
  # One-off: `docker compose -f docker-compose.prod.yml run --rm backup backup.sh`
  backup:
    build: scripts/backup
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:-payload}@postgres:5432/payload
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    restart: unless-stopped

  # Self-hosted S3-compatible storage (opt-in): `docker compose -f docker-compose.prod.yml --profile storage up -d`,
  # then STORAGE_DRIVER=s3 and S3_ENDPOINT=http://garage:3900 (see README "Stockage des fichiers").
  # Not reachable from outside; put a reverse proxy on :3902 only if you want S3_PUBLIC_URL.
  garage:
    profiles: [storage]
    image: dxflrs/garage:v2.2.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32)}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

volumes:
  garage-meta:
  garage-data:
  media:
  private-files:
  postgres-data:
  backups:
