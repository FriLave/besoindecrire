# Production stack: `docker compose -f docker-compose.prod.yml up --build -d`
# Env is read from `.env` (see .env.example). DATABASE_URL is overridden below to target the `postgres` service.
services:
  app:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:-payload}@postgres:5432/payload
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/public/media
      - private-files:/app/private-files
    ports:
      - '${APP_PORT:-3000}:3000'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: payload
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Daily pg_dump (BACKUP_CRON, default 02:00 UTC) to the `backups` volume, or to S3 if BACKUP_S3_BUCKET is set.
  # One-off: `docker compose -f docker-compose.prod.yml run --rm backup backup.sh`
  backup:
    build: scripts/backup
    # No env_file: the sidecar only gets what it needs, not the app secrets. Values are read from the
    # compose interpolation env (`.env`, or `--env-file` if you use a custom ENV_FILE).
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:-payload}@postgres:5432/payload
      BACKUP_CRON: ${BACKUP_CRON:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    restart: unless-stopped

  # Self-hosted S3-compatible storage (opt-in): `docker compose -f docker-compose.prod.yml --profile storage up -d`,
  # then STORAGE_DRIVER=s3 and S3_ENDPOINT=http://garage:3900 (see README "Stockage des fichiers").
  # Not reachable from outside; put a reverse proxy on :3902 only if you want S3_PUBLIC_URL.
  garage:
    profiles: [storage]
    image: dxflrs/garage:v2.2.0
    environment:
      # Required with --profile storage (openssl rand -hex 32): Garage refuses to start when empty.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

volumes:
  garage-meta:
  garage-data:
  media:
  private-files:
  postgres-data:
  backups:
