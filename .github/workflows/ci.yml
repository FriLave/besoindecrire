name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values: CI uses a throwaway Postgres service, no real secret.
  DATABASE_URL: postgres://payload:payload@127.0.0.1:5432/payload
  PAYLOAD_SECRET: ci-payload-secret
  PREVIEW_SECRET: ci-preview-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Committed generated files must match the config (CLAUDE.md: generate:types after every change).
      - name: Generated files drift check
        run: |
          pnpm generate:types
          pnpm generate:importmap
          if ! git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'; then
            echo "::error::Generated files out of date: run pnpm generate:types and pnpm generate:importmap, then commit"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push): catches a broken Dockerfile before client deploy time.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: scripts/backup
          push: false

  test:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_PUSH: '0'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh DB: committed migrations must apply, then the config must not drift from them.
      # From here on PAYLOAD_PUSH=0: tests run on the migrated schema, no dev `push` racing them.
      - run: pnpm migrate
      - name: Schema drift check
        run: |
          pnpm migrate:create --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            git status --porcelain src/migrations
            echo "::error::Schema drift: run pnpm migrate:create and commit"
            exit 1
          fi
      # Seed before int tests (api specs read the demo pages), build (static params read the DB) and e2e.
      - run: pnpm seed:local
      - run: pnpm test:int
      - run: pnpm build
      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Migrated schema, no dev `push`: `pnpm start` (prod) would refuse a pushed schema.
      PAYLOAD_PUSH: '0'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm seed:local
      - run: pnpm build
      - name: Start production server
        run: |
          pnpm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
